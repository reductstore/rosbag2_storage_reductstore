name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install ROS and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl gnupg lsb-release software-properties-common
          sudo add-apt-repository --yes universe
          sudo curl --fail --silent --show-error --location https://raw.githubusercontent.com/ros/rosdistro/master/ros.key --output /usr/share/keyrings/ros-archive-keyring.gpg
          printf 'deb [arch=%s signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu %s main\n' "$(dpkg --print-architecture)" "$(source /etc/os-release && printf '%s' "$UBUNTU_CODENAME")" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake git libconcurrentqueue-dev libcpp-httplib-dev libcurl4-openssl-dev libfmt-dev libssl-dev nlohmann-json3-dev python3-colcon-common-extensions python3-vcstool ros-jazzy-ament-cmake-vendor-package ros-jazzy-rosbag2-storage ros-jazzy-yaml-cpp-vendor
      - name: Build packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-up-to rosbag2_storage_reductstore --event-handlers console_direct+
      - name: Test package
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select rosbag2_storage_reductstore --event-handlers console_direct+
          colcon test-result --verbose
